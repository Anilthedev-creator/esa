<div class="booking-container">
<form id = "bookingForm" >

  <h2>Booking Information</h2>
  
  <div class="form-group">
    <label for="fullName">
      Full name *
      
    </label> 
    <input type="text" id = "fullName" required>  
  </div>


  <div class="form-group">
    <label for="email">
      Email *
      
    </label>


    <input type="text" id = "email" required>
 
  </div>

  <div class="form-group">
    <label for = "phoneNumber">
      Phone 
      
    </label>
    <input type="text" id = "phoneNumber">
    
  </div>



  <div class="form-group">
    <label for="bookingDate">
      Select a date *
      
    </label>


    <input type="date" id = "bookingDate" required>
 
  </div>


  <div class="form-group">
    <label for="abnNumber">
      ABN number *
      
    </label>


    <input type="text" id = "abnNumber" maxlength="11" required>
 
  </div>


  <div class="form-group"  >
         <label for="serviceType">

               Select a service *
      
         </label>
         

     <select id="serviceType"  required>
          <option value="Plant Commissioning">
                Plant Commissioning
        
          </option>

          <option value="Utility Appraisals">
                Utility Appraisals
        
          </option>

          <option value="Production Optimisation">
                 Production Optimisation
        
          </option>


          <option value="Dangerous Goods">
    
                 Dangerous Goods
          </option>

         <option value="Waste Management">
                 Waste Management
        
          </option>

      
      </select>
     


    </div>

      <div class="form-group" style="margin-top: 12px;">
          <label for="Description" >
                 Description (optional)
      
          </label>
          <textarea id = "description" rows="5" placeholder="Describe your project requirements"></textarea>

       </div>

       <button
         type = "submit" class = "submitButton" >
         Submit Booking
       </button>


   
 
  </div>
  
  <script src="js/booking.js"></script>

</form>
