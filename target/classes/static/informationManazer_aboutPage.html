
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Manager</title>

    <link rel="stylesheet" href="informationManagementAboutPage.css">
</head>

<body>

<div class="container">

    <h1>Information Manager</h1>
    <h2>About Page</h2>

    <div class="form-group">
        <label>Story</label>
        <div>
            <textarea id="story"></textarea>
            <div class="word-limit">Maximum 3000 words</div>
        </div>
    </div>

    <div class="form-group">
        <label>Heading 1</label>
        <input type="text" id="heading1">
    </div>

    <div class="form-group">
        <label>Paragraph 1</label>
        <div>
            <textarea id="paragraph1"></textarea>
            <div class="word-limit">Maximum 3000 words</div>
        </div>
    </div>

    <div class="form-group">
        <label>Heading 2</label>
        <input type="text" id="heading2">
    </div>

    <div class="form-group">
        <label>Paragraph 2</label>
        <div>
            <textarea id="paragraph2"></textarea>
            <div class="word-limit">Maximum 3000 words</div>
        </div>
    </div>

    <div class="form-group">
        <label>Specialist 1 Name</label>
        <input type="text" id="specialist1Name">
    </div>

    <div class="form-group">
        <label>Specialist 1 Position</label>
        <input type="text" id="specialist1Position">
    </div>

    <div class="form-group">
        <label>Specialist 1 Biography</label>
        <div>
            <textarea id="specialist1Biography"></textarea>
            <div class="word-limit">Maximum 3000 words</div>
        </div>
    </div>

    <div class="form-group">
        <label>Specialist 2 Name</label>
        <input type="text" id="specialist2Name">
    </div>

    <div class="form-group">
        <label>Specialist 2 Position</label>
        <input type="text" id="specialist2Position">
    </div>

    <div class="form-group">
        <label>Specialist 2 Biography</label>
        <div>
            <textarea id="specialist2Biography"></textarea>
            <div class="word-limit">Maximum 3000 words</div>
        </div>
    </div>

    <button id="saveButton">Save Changes</button>

</div>

<script src="/js/admin-about.js"></script>

</body>
</html>
