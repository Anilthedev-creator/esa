server.port=8080
# Set the official HTTPS site origin before launch to enable a domain-correct sitemap.
app.public-site-url=${PUBLIC_SITE_URL:}

# --- Datasource: H2 file-based by default (works without Postgres) ---
# To use Postgres, set env vars or override:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/esa_database
#   spring.datasource.username=...
#   spring.datasource.password=...
#
# NOTE: do NOT add MODE=PostgreSQL / DATABASE_TO_LOWER to the H2 URL. Those
# H2 compatibility flags disagree with H2Dialect and made Hibernate's
# "ddl-auto=update" skip the new tables (cms_pages, site_settings, ...), which
# surfaced as: Table "site_settings" not found.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/esa_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# First administrator (created once, then never again)
app.admin.enabled=true
app.admin.email=${ADMIN_EMAIL:admin@esaengineering.com.au}
app.admin.password=${ADMIN_PASSWORD:Admin123}
app.admin.name=${ADMIN_NAME:ESA Administrator}

# Consultation fee charged at booking (step 2 of the booking flow).
# Shown on payment.html and stored on the Payment row. Change here, not in Java.
app.booking.consultation-fee=50
# Demo email previews are opt-in and must stay off in production.
app.demo-email-preview=${ESA_DEMO_EMAIL_PREVIEW:false}
# The built-in card route is only a local demo. Turn it off in any production setup.
app.payment.demo-card-enabled=${ESA_DEMO_CARD_PAYMENTS:true}

# Session tokens; without a secret they die on every restart
app.auth.token-secret=${JWT_SECRET:esa-local-dev-secret-change-me-in-production-32chars}
app.auth.token-ttl-hours=12

# Optional SMTP settings for automatic enquiry acknowledgement and team email.
# Without these, messages are saved to data/outbox and are not sent.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SECURE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${SMTP_USER:}}
app.mail.enquiry-to=${ENQUIRY_NOTIFY_EMAIL:${ADMIN_EMAIL:admin@esaengineering.com.au}}

# Allow static resources and SPA fallback
spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=true
