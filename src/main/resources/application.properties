server.port=8080

# --- Datasource: H2 in-memory by default (works without Postgres) ---
# To use Postgres, set env vars or override:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/esa_database
#   spring.datasource.username=...
#   spring.datasource.password=...
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/esa_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# First administrator (created once, then never again)
app.admin.enabled=true
app.admin.email=admin@esaengineering.com.au
app.admin.password=Admin123
app.admin.name=ESA Administrator

# Session tokens; without a secret they die on every restart
app.auth.token-secret=esa-local-dev-secret-change-me-in-production-32chars
app.auth.token-ttl-hours=12

# Allow static resources and SPA fallback
spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=true
