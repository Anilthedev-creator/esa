<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Administrator</title>

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="create-admin-card">

    <h1>Create Administrator</h1>

    <p class="subtitle">
        Create a new administrator account. An invitation email will be sent automatically.
    </p>

    <form id="createAdminForm">

        <div class="form-group">

            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="John Smith">

        </div>


        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="john@esaengineering.com.au">

        </div>
        


      



        <button id="createButton" type="submit">

            Send invitation

        </button>

    </form>

</div>


<script src="/js/createAdmin.js"></script>

</body>
</html>
