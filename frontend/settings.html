<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

  <title>Settings | ESA Admin</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    rel="stylesheet"
  />
</head>

<body data-admin-page="settings">

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">

    <div class="sidebar-logo">
      <img src="images/logo-white.png" alt="Engineering Services Australia">
    </div>

    <nav class="sidebar-nav">

      <a href="dashboard.html">
        <i class="fa-solid fa-gauge-high"></i> Dashboard
      </a>

      <a href="content.html">
        <i class="fa-solid fa-file-lines"></i> Content Management
      </a>

      <a href="customers.html">
        <i class="fa-solid fa-users"></i> Customer Management
      </a>

      <a href="payments.html">
        <i class="fa-solid fa-credit-card"></i> Payments
      </a>

      <a href="enquiries.html">
        <i class="fa-solid fa-envelope"></i> Enquiries
      </a>

      <a href="analytics.html">
        <i class="fa-solid fa-chart-line"></i> Analytics
      </a>

      <a class="active" href="settings.html">
        <i class="fa-solid fa-gear"></i> Settings
      </a>

    </nav>

    <div class="sidebar-user">

      <div class="user-circle">
        AD
      </div>

      <div>
        <p>Admin User</p>
        <span>Administrator</span>
      </div>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- TOPBAR -->
    <header class="admin-topbar">

      <div class="topbar-links">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About us</a>
      </div>

      <button id="adminToggle" class="admin-btn" aria-controls="sidebar" aria-expanded="false">
        Menu
      </button>

    </header>

    <!-- PAGE -->
    <section class="dashboard-wrapper">

      <!-- TITLE -->
      <div class="dashboard-title">
        <i class="fa-solid fa-bars"></i>
        <h2>Settings</h2>
      </div>

      <!-- SETTINGS CARD -->
      <div class="settings-card">

        <h1 class="settings-main-title">
          General Setting
        </h1>

        <!-- FORM -->
        <form class="settings-form" id="settingsForm">

          <!-- SITE NAME -->
          <div class="form-group-settings">

            <label>
              Site Name
            </label>

            <input
              type="text"
              placeholder="ESA Engineering"
              id="settingsSiteName"
            />

          </div>

          <!-- ADMIN EMAIL -->
          <div class="form-group-settings">

            <label>
              Admin Email
            </label>

            <input
              type="email"
              placeholder="admin@esa.com.au"
              id="settingsAdminEmail"
            />

          </div>

          <!-- TIME ZONE -->
          <div class="form-group-settings">

            <label>
              Time Zone
            </label>

            <input
              type="text"
              placeholder="Australia/Melbourne"
              id="settingsTimezone"
            />

          </div>

          <!-- LANGUAGE -->
          <div class="form-group-settings">

            <label>
              Language
            </label>

            <input
              type="text"
              placeholder="English"
              id="settingsLanguage"
            />

          </div>

          <!-- BUTTON -->
          <div class="settings-btn-wrapper">

            <button type="submit" class="save-btn" id="settingsSaveBtn">
              Save
            </button>
            <span id="settingsStatus" style="font-size:14px;font-weight:600"></span>
          </div>

        </form>

      </div>

    </section>

  </main>

</div>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script src="admin-data.js" defer></script>

</body>
</html>
