<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Administrator</title>

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="create-admin-card">

    <h1>Create Administrator</h1>

    <p class="subtitle">
        Create a new administrator account. The new admin can sign in straight away.
    </p>

    <form id="createAdminForm">

        <div class="form-group">

            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="John Smith">

        </div>


        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="john@esaengineering.com.au">

        </div>


        <div class="form-group">

            <label for="phoneNumber">
                Phone Number
            </label>

            <input
                type="text"
                id="phoneNumber"
                placeholder="0400 000 000">

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Min 8 characters">

        </div>
        


      



        <button id="createButton" type="submit">

            Create account

        </button>

    </form>

</div>


<script src="createAdmin.js"></script>

</body>
</html>
