<!DOCTYPE html>
<html>
<head>
    <title>Booking Successful</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .success-card{
            width: 500px;
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            text-align: center;
            border-bottom: 5px solid #00adef;
        }
        h1{
            color: #1d2b53;
            margin-bottom: 20px;
            font-size: 32px;
        }

        p{
            color: #555;
            line-height: 1.8;
            margin-bottom:15px;     
       }
       .home-btn{
        display: inline-block;
        margin-top: 25px;
        padding: 12px 28px;
        background: #00adef;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: .3s;
       }
       .home-btn: hover{
        background: #008fc5;
       }
       
    </style>
</head>

<body>

<div class="success-card">

    <h1>✅ Booking Submitted</h1>

    <p>
        Thank you for contacting ESA Engineering.
    </p>

    <p>
        Our engineering team will review your booking and
        contact you within 2 business days.
    </p>

    <a href="index.html">
        Return Home
    </a>

</div>

</body>
</html>
